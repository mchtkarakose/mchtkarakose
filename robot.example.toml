# Bu dosyayı robot.toml olarak kopyalayıp düzenleyin.
# Gizli anahtarlar (API anahtarları) BURAYA YAZILMAZ; ortam değişkeni olarak verilir:
#   ANTHROPIC_API_KEY, AZURE_SPEECH_KEY, AZURE_SPEECH_REGION

[robot]
ad = "Robi"                  # Robotun adı
kullanici = "varsayilan"     # Hafızanın ait olduğu kullanıcı kimliği

[beyin]
model = "claude-opus-5-5"
# Düşünme derinliği: low | medium | high. Sohbette düşük gecikme için "low" önerilir.
effort = "low"
max_tokens = 8000
# Model güvenlik nedeniyle yanıt veremezse sunucu tarafında yedek modele geçilsin mi?
yedek_model = true

[hafiza]
veritabani = "data/hafiza.db"
konusmalari_kaydet = true    # false: konuşma metinleri hiç saklanmaz
ozet_cikar = true            # Konuşma bitince özet çıkarılıp saklansın mı?
ozet_sayisi = 3              # Yeni konuşmaya taşınacak son özet sayısı
ilgili_bilgi_sayisi = 5      # Her mesajda aranacak ilgili bilgi sayısı
bosta_kalma_dk = 5           # Bu kadar dakika sessizlikte konuşma kapatılır (özetlenir)

[ses]
# dinleyici: "klavye" (test) | "azure"
dinleyici = "klavye"
# konusmaci: "konsol" (test) | "azure"
konusmaci = "konsol"
dil = "tr-TR"
ses_adi = "tr-TR-EmelNeural"     # veya tr-TR-AhmetNeural
sessizlik_ms = 600               # Konuşmanın bittiğine karar vermek için sessizlik süresi
