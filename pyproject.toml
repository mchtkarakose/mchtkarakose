[project]
name = "akilli-robot"
version = "0.1.0"
description = "Akıllı Sesli İletişim ve Etkileşim Robotu - yazılım altyapısı"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.10",
]

[project.optional-dependencies]
azure = ["azure-cognitiveservices-speech>=1.40"]
ucretsiz = ["sounddevice>=0.5", "soundfile>=0.12", "numpy>=1.26", "SpeechRecognition>=3.10", "edge-tts>=6.1"]
dev = ["pytest>=8"]

[project.scripts]
robot = "robot.cli:main"

[tool.setuptools.packages.find]
include = ["robot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
